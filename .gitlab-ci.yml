---
stages:
  - lint
  - prove


# https://stackoverflow.com/a/65864572/
.no-duplicate-pipelines: &no-duplicate-pipelines
  if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
  when: never    # do not run branch push pipelines when a MR is already open on the branch


lint:
  stage: lint
  rules:    # some rule required if any other job has 'rules:'
    - *no-duplicate-pipelines
    - when: on_success    # GitLab default
  image:
    name: alpine/git:latest
    entrypoint: [""]    # override default entrypoint "git"
  script:
    - "# Listing any text files containing CR characters:"
    - sh -c "! git grep -IlP '\x0d'"
    - "# Listing any text files containing TAB characters:"
    - sh -c "! git grep -IlP '\x09'"
    - "# Listing any text files with trailing whitespace:"
    - sh -c "! git grep -Il '[[:blank:]]$'"
    - "# Listing any text files without trailing newline (except external libs):"
    - sh -c 'git grep -Il "" | grep -v ^root/static/lib/ | while read file; do test "$( tail -c1 "$file" )" && echo "$file"; done | tee >( cat >&2 ) | [ $(wc -c) -eq 0 ]'


# latest supported Perl version
perl-5.38:
  stage: prove
  rules:    # some rule required if any other job has 'rules:'
    - *no-duplicate-pipelines
    - when: on_success    # GitLab default

  image: perl:5.38
  cache:
    key: perl-5.38-local-lib-shared-between-all-branches
    paths:
      - perl5/

  services:
    - name: postgres:bookworm

  variables:
    POSTGRES_PASSWORD: coocook    # for "postgres" setup
    PGHOST:            postgres   # for DBD::Pg
    PGUSER:            postgres
    PGPASSWORD:        coocook

  before_script:
    # install coverage analyzer, install and activate local::lib
    - PERL5LIB=perl5/lib/perl5/ cpanm --notest --local-lib perl5/ Devel::Cover local::lib
    - 'eval "$( perl -Iperl5/lib/perl5/ -Mlocal::lib=perl5/ )"'

    # install our dependencies
    - cpanm --notest --installdeps --with-configure --with-develop --with-recommends .

  script:
    - perl Makefile.PL
    - AUTHOR_TESTING=1 cover -ignore_re ^perl5/ -ignore_re SHSchema -make 'make TEST_VERBOSE=1' -test

  coverage: '/^Total .+ (\d+\.\d+)$/'


# minimal supported Perl version
# (basically the same as perl-5.38 but without author testing or code coverage)
perl-5.32:
  stage: prove
  rules:
    - *no-duplicate-pipelines
    - if: $CI_COMMIT_REF_NAME == "master"
    - when: manual
      allow_failure: true    # do not block pipeline
  image: perl:5.32
  cache:
    key: perl-5.32-local-lib-shared-between-all-branches
    paths: [perl5/]
  before_script:
    - PERL5LIB=perl5/lib/perl5/ cpanm --notest --local-lib perl5/ local::lib
    - 'eval "$( perl -Iperl5/lib/perl5/ -Mlocal::lib=perl5/ )"'
    - cpanm --notest --installdeps --with-configure .
  script:
    - perl Makefile.PL
    - make
    - make test
